[project]
name = "yang-to-rdf"
version = "0.2.0"
description = "Convert YANG modules to RDF TBox vocabularies and SHACL validation shapes for 3GPP NRM and telecom network models"
authors = [{name = "Jean Martins", email = "jean.martins@ericsson.com"}]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["yang", "rdf", "shacl", "3gpp", "nrm", "telecom", "semantic-web", "network-management", "5g", "ontology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyang>=2.6.0",
    "rdflib>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/EricssonResearch/yang-to-rdf"
Repository = "https://github.com/EricssonResearch/yang-to-rdf"

[project.scripts]
yang-to-rdf = "yang_to_rdf.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yang_to_rdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
